name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: file:./dev.db
  # Skip git-hook installation in CI. The hooks exist to give fast local feedback; CI runs the
  # same checks directly, and installing them here only risks a hook firing inside a workflow.
  HUSKY: 0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # PRs must stay under ~15 minutes (doc 08 §7) — slower than that and people stop running them.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Guards the package boundaries from docs/plan/00-architecture.md §2.
      # Cruises source-to-source via tsconfig.depcruise.json — see the comment in that file.
      - name: Architecture rules
        run: npm run depcruise

  # Drives the wizard in a browser: five steps, a real provision, the catalog.
  #
  # Separate from `verify` because it needs a browser download and a running server, and separate
  # from `smoke` because it tests the product rather than the output. It found two real bugs on
  # its first run — a duplicated stage list and a hydration failure — neither visible to any
  # test that does not actually click.
  e2e:
    name: E2E (wizard)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create the database
        run: npm --workspace @idp/db run db:deploy
        env:
          DATABASE_URL: file:./dev.db

      # Chromium only. The portal is an internal tool behind a single supported browser, and
      # three engines would triple the runtime for coverage nobody has asked for.
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/portal

      - name: Run
        run: npm run e2e
        working-directory: apps/portal
        env:
          DATABASE_URL: file:../../packages/db/dev.db

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/portal/playwright-report/
          retention-days: 7

  # Generates real projects and runs them: install, build, boot, HTTP request.
  #
  # Everything in `verify` is static — it proves we produced the files we meant to. Only this
  # job catches a version pin that stopped resolving, a Next build that trips over generated
  # types, or a plugin registered in the wrong order. It is the slowest thing we run and the
  # only one that would have caught the Tailwind and Prisma failures found by hand in P1.
  #
  # Separate from `verify` so it runs in parallel and a smoke failure names itself, rather than
  # appearing as the twentieth step of a long job.
  smoke:
    name: Smoke (generated projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        # Without a health check the job races the database and fails on first connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # With a reachable database the harness requires /ready to return 200, not merely to
      # answer. That turns the readiness probe into a real assertion about Prisma connecting.
      SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The harness imports the built packages rather than the sources.
      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke

  # Lints the ops artifacts: Dockerfiles, Helm charts, ArgoCD manifests, GitHub workflows.
  #
  # The gap this closes is the one the smoke harness cannot: nothing in a generated repository
  # *executes* its chart or its workflows during a build, so a chart that renders invalid YAML or
  # probes a path nobody serves passes every other job here and fails only against a real cluster.
  # By then a repository has been provisioned and handed to a team.
  #
  # None of the four tools ship as npm packages, so they are installed here rather than through
  # the lockfile. `--require-all` makes a failed install a red job — without it the script would
  # skip the missing tool and report a green tick for a suite that checked almost nothing.
  ops:
    name: Ops artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The harness imports the built packages rather than the sources.
      - name: Build
        run: npm run build

      # Preinstalled on ubuntu-latest, but pinned rather than assumed: a runner image change that
      # drops it would otherwise turn every chart check into a silent skip.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Versions are pinned for the same reason the generated projects pin theirs — a linter that
      # gains a rule overnight fails a PR that changed nothing.
      - name: Install the ops linters
        env:
          HADOLINT_VERSION: v2.12.0
          ACTIONLINT_VERSION: 1.7.7
          KUBECONFORM_VERSION: v0.6.7
          CONFTEST_VERSION: 0.56.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"

          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint

          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform

          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" conftest

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ops lint
        run: npm run ops:lint

  # Verifies the version manifest still resolves. Runs separately so a registry outage
  # cannot block an otherwise-good PR.
  versions:
    name: Version manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check pinned versions resolve
        run: node scripts/check-versions.mjs
