name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: file:./dev.db
  # Skip git-hook installation in CI. The hooks exist to give fast local feedback; CI runs the
  # same checks directly, and installing them here only risks a hook firing inside a workflow.
  HUSKY: 0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # PRs must stay under ~15 minutes (doc 08 §7) — slower than that and people stop running them.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Guards the package boundaries from docs/plan/00-architecture.md §2.
      # Cruises source-to-source via tsconfig.depcruise.json — see the comment in that file.
      - name: Architecture rules
        run: npm run depcruise

  # Generates real projects and runs them: install, build, boot, HTTP request.
  #
  # Everything in `verify` is static — it proves we produced the files we meant to. Only this
  # job catches a version pin that stopped resolving, a Next build that trips over generated
  # types, or a plugin registered in the wrong order. It is the slowest thing we run and the
  # only one that would have caught the Tailwind and Prisma failures found by hand in P1.
  #
  # Separate from `verify` so it runs in parallel and a smoke failure names itself, rather than
  # appearing as the twentieth step of a long job.
  smoke:
    name: Smoke (generated projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        # Without a health check the job races the database and fails on first connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # With a reachable database the harness requires /ready to return 200, not merely to
      # answer. That turns the readiness probe into a real assertion about Prisma connecting.
      SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The harness imports the built packages rather than the sources.
      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke

  # Verifies the version manifest still resolves. Runs separately so a registry outage
  # cannot block an otherwise-good PR.
  versions:
    name: Version manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check pinned versions resolve
        run: node scripts/check-versions.mjs
